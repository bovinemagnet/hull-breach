[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features="production,release_candidate"
export_filter="all_resources"
include_filter="core/utilities/build_metadata.generated.cfg,LICENSE,PRIVACY.md,THIRD_PARTY_NOTICES.md"
exclude_filter="addons/*,tests/*,docs/*,.github/*,build/*,reports/*,tools/*,levels/dev/*,assets/original/source/*,*.psd,*.kra,*.aseprite,*.blend,raw_audio/*,source_art/*"
export_path="build/linux/hull-breach.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
architecture="x86_64"
ssh_remote_deploy/enabled=false

